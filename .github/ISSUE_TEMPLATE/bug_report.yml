name: Bug report
description: Something in the hub (roadmap, family checks, harness, docs) is wrong.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not paste credentials, account IDs, IPs or e-mail addresses:
        replace them with placeholders such as `<ACCOUNT_ID>` or `<YOUR_IP>/32`.
        A bug of one lab repository belongs to that repository.
  - type: input
    id: commit
    attributes:
      label: Commit SHA of tx00v2
      placeholder: 40-character SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - ROADMAP.md
        - family checks (make family)
        - static checks (make static)
        - docs
        - GitHub workflows or repository settings
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands, environment (Linux, WSL, macOS, Docker) and FAMILY_SOURCE if set.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual result
      description: Include the relevant PASS/FAIL lines or error output (redacted).
    validations:
      required: true
